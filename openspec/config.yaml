schema: spec-driven

context: |
  Sistema_inmobiliaria: WPF + MVVM desktop app (.NET 10 LTS, CommunityToolkit.Mvvm)
  for a single real-estate agency (Del Lago), 2 trusted internal users.
  Data: Supabase Postgres via EF Core + Npgsql directly from the WPF client (no API).
  File storage: Supabase Storage (signed lease PDFs). Email: SMTP for notices.
  No .sln/.csproj yet — deliberate, spec-first. Do not scaffold app code before specs.
  PDF library and scheduler mechanism not yet chosen. See `open_decisions` below.

open_decisions:
  - id: scheduler-mechanism
    summary: >
      Automated notifications (60/30/15 days before due) must fire while the
      desktop app is closed. Undecided: Supabase pg_cron + Edge Function, or
      a console executable run as a Windows Scheduled Task.
  - id: pdf-library
    summary: PDF generation library not yet chosen.

resolved_decisions:
  - id: credential-exposure
    resolved: 2026-09-25
    decision: >
      Resolved by the users-and-roles change: each user authenticates with their OWN personal
      PostgreSQL login role and password, never a shared application credential. There is no
      connection string containing a password on disk to leak — the password is typed at login
      and lives only in that session's memory for its lifetime (spec "No Database Credential
      Stored on Disk, and No Supabase Auth"). Admin/Empleado separation is enforced by real
      PostgreSQL GRANTs bound to two group roles (inmobiliaria_admin, inmobiliaria_empleado),
      not by anything the UI merely hides — an Empleado connecting with pgAdmin instead of this
      application, using her own credentials, still carries only her own role's privileges
      (spec "Enforcement by Database GRANT — Bypassing the Application Gains Nothing").
    rationale: >
      This was exactly the tradeoff the original open decision named: "accept for 2 trusted
      users, or move to Supabase Auth with real Postgres roles/RLS." The users-and-roles change
      took neither option literally — Supabase Auth was considered and REJECTED (spec Decision
      2; it would add a token exchange and an auth mapping this project has no other use for) —
      but it delivers the substance the second option was reaching for: real per-user Postgres
      roles instead of one shared, exposable credential. Row Level Security was also considered
      and explicitly rejected, not merely deferred (spec "No Row-Level Restriction"): both
      roles perform identical operational work over every row, so no row-level rule this
      business needs exists to justify it. Table-level GRANT is the enforcement mechanism
      instead, and spec tests 22–29 prove it holds even when the application is bypassed
      entirely.
  - id: supabase-org
    resolved: 2026-09-07
    decision: >
      This project gets its OWN Supabase organization. It does not share one
      with the team's other (padel) system.
    rationale: >
      The padel system may grow enough to consume the shared organization-level
      quota (MAU, bandwidth, storage) and leave this system without a database.
      Isolating the risk is worth the extra organization.
    note: >
      Provisioned 2026-09-13 under a personal Supabase account as a temporary
      measure, because the team could not access the shared account. The project
      is to be transferred to a Volkode-owned organization before any real
      agency data is stored. A transfer moves the project in place (project
      settings -> transfer), requires the transferring user to be a member of
      both organizations, and does not change the region. Region is the one
      setting a transfer cannot fix, so it was chosen correctly up front.
      Free plan allows 2 active free projects per ACCOUNT across all
      organizations where the user is Owner or Admin, not per organization.
  - id: postgres-version
    resolved: 2026-09-13
    decision: >
      The provisioned Supabase project reports PostgreSQL 17.6
      (x86_64-pc-linux-gnu). Pin the Testcontainers image to postgres:17.6.
    rationale: >
      The design forbids guessing this. Testing against a different major
      version would reintroduce exactly the production-fidelity gap that
      choosing Testcontainers over the EF InMemory provider was meant to close.
  - id: data-api-disabled
    resolved: 2026-09-13
    decision: >
      The Supabase Data API (PostgREST) is DISABLED on this project, along with
      automatic exposure of new tables. Automatic RLS is off.
    rationale: >
      The WPF client connects directly through EF Core and Npgsql and never uses
      supabase-js or the REST API, so an internet-facing HTTP surface over a
      database holding tenant DNIs and lease contracts would be pure attack
      surface with no benefit. RLS stays off, for a corrected reason: this
      entry originally assumed every EF Core connection authenticates as the
      table owner and bypasses RLS for that reason, and that the question would
      be revisited once `credential-exposure` resolved via per-user Postgres
      roles. `credential-exposure` has since resolved that way (see
      `resolved_decisions`) — every connection now authenticates as an
      individual personal login role, a member of `inmobiliaria_admin` or
      `inmobiliaria_empleado`, and neither role owns any table (design
      Decision 9). RLS was then considered on its own merits and explicitly
      REJECTED, not deferred (spec "No Row-Level Restriction"): both roles do
      identical operational work over every row, so no row-level rule this
      business needs exists to justify it. Enforcement is by table-level GRANT
      instead. A greyed-out PostgREST service in the dashboard remains the
      expected result.

strict_tdd: false

testing:
  status: available
  framework: xunit
  framework_chosen: 2026-09-07
  framework_rationale: >
    Used by the .NET team itself, so answers exist when something breaks; no
    setup/teardown attributes (constructor + IDisposable is plain C#, one less
    framework concept for a learning team); MIT licensed, matching the team's
    free-software preference.
  ef_testing_decision: >
    design.md Decision 4, resolved 2026-09-13: Testcontainers for .NET
    (Testcontainers.PostgreSql), image pinned to postgres:17.6 — the exact
    version the provisioned Supabase project reports (resolved_decisions:
    postgres-version). The EF InMemory provider was rejected upstream by the
    proposal (it enforces no constraints and would pass tests that fail in
    production) and was not revisited. Rejected alternative: a dedicated
    Supabase test schema (shared-state risk between two developers running
    tests concurrently, and a live production-grade credential in CI with no
    fidelity benefit this change actually exercises). The fixture
    (`tests/Inmobiliaria.Infrastructure.Tests/PostgresFixture.cs`) calls
    `Database.Migrate()`, never `EnsureCreated()`, so the hand-written
    deferred-trigger SQL from the migration is actually present when tests
    run. Docker Desktop is not guaranteed on the office Windows PC, so the
    fixture skips (does not fail) when the daemon is unreachable locally; the
    `core` CI job on ubuntu-latest always has Docker, so the gate cannot be
    bypassed on the way to main.

conventions:
  - id: new-table-ships-with-grants
    established: 2026-09-25
    rule: >
      Any migration that creates a new table MUST grant, in that same migration, the baseline
      SELECT and the deliberately chosen write privileges to both application PostgreSQL roles
      (inmobiliaria_admin, inmobiliaria_empleado). A table with no grants MUST NOT ship in a
      state where the application fails at runtime for both roles the moment either one queries
      it.
    rationale: >
      Established by the users-and-roles change (spec "Every New Table Ships With Its GRANTs in
      the Same Migration"), generalizing what that change's own migration already had to do for
      the thirteen tables that existed before it plus the one it created. An ungranted table is
      not a design question to defer to a follow-up — it is a defect that surfaces the moment
      either role's session queries it, and the fix belongs in the same migration that created
      the table, not in something a later PR has to remember to add.
  - id: branch-meaning
    established: 2026-09-18
    rule: >
      `ramatomy` and `ramateo` are individual working branches, unprotected.
      `develop` is the integration branch and the repository's default branch on
      GitHub: every slice PR targets it. `main` advances once per change, when
      that change closes verified and archived — it means "this passed review
      and tests", never "whatever develop happened to hold". Promoting a change
      to main is therefore one extra pull request (develop -> main) at the end of
      each change, and the ruleset requires an approval on it like any other.
    rationale: >
      A branch whose meaning is never defined acquires one by accident. The
      alternative considered was reserving main for the first release the agency
      can actually run, but that would have left main empty for months, made a
      public repository look abandoned, and created a special rule to remember
      with no payoff until then. Advancing main per closed change gives it a real
      and checkable meaning today.
    note: >
      `develop` became the default branch on 2026-09-18. Before that, every new
      pull request defaulted to `main` as its base and had to be corrected by
      hand — a recurring source of near-misses.
  - id: confirm-with-a-summary
    established: 2026-09-16
    rule: >
      Every operation that moves money MUST show a summary of what is about to
      happen before it is confirmed: the previous value, the inputs used, and
      the resulting value. This is a system-wide principle, not a feature of any
      one change — it applies to a rent adjustment, to marking a payment, to
      issuing a receipt, and to anything that follows.
    rationale: >
      Confirmation is the exact point where a typing mistake becomes money
      someone owes. One extra zero in an index multiplies a tenant's rent.
      Showing the result before it is committed costs almost nothing and catches
      the error while it is still free; afterwards there is an issued receipt
      and an angry tenant.
  - id: whole-peso-amounts
    established: 2026-09-17
    rule: >
      Amounts charged to a tenant or rendered to an owner are whole pesos.
      A computed amount is TRUNCATED, not rounded: 47,860.80 becomes 47,860.
      Storage precision stays numeric(14,2) — the two are different things and
      coexist. Never use floating point for money.
    rationale: >
      Evidence, not preference. Every figure on the agency's real receipt is a
      whole peso: alquiler 507,000; tasa municipal 28,900; recargo 91,260; neto
      650,542.00. And the owner receipt's honorarios line reads 47,860 where the
      exact arithmetic gives 47,860.80 — the agency already truncates. Argentine
      cent coins no longer circulate, so a centavo on an invoice is a figure
      nobody can pay in cash.
    confirmed: >
      2026-09-23, by the agency owner. The rule stands and is no longer an
      inference. Two things that sound contradictory are both true and describe
      different moments: the printed document truncates (the 47,860 line above),
      and the agency then rounds the PHYSICAL CASH at the register. The owner's
      words: they round it themselves, and a decimal result does not bother
      them. So truncation matches the paper, and the cash difference is settled
      by hand exactly as it is today.
    requested_extension: >
      The owner asked, as an optional nicety and not a requirement, that the
      system offer a rounding option. `RoundingRule` already has room for a
      second member; this is additive and belongs to the collection change, not
      here. See openspec/domain/respuestas-del-dueno.md.

rules:
  all_phases:
    - Read `openspec/domain/respuestas-del-dueno.md` before writing any artifact that touches
      receipts, collection, honorarios, adjustment indices, tenant balances or invoicing. It is the
      record of what the agency owner actually confirmed, and of what we believed before he did.
      Several facts in it contradict inferences made earlier from the two sample receipts.
    - Never re-derive a domain fact from the sample receipts when that file already answers it.
      Deriving from the receipts is what produced the inferences it corrects.
  proposal:
    - Reference relevant domain Engram observations (topic_key `domain/*`) instead of restating them
    - Include rollback plan for risky changes
    - Flag any `open_decisions` above that the proposal touches, without resolving them silently
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Domain terms without a clean English equivalent that appear on legal documents
      (locador, locatario, codeudor, recargo, honorarios, tasa municipal, sellado
      provincial, ICL, IPC, RIPTE) may be kept as domain vocabulary with an English
      gloss on first use; structure, prose, and identifiers otherwise stay English
  design:
    - Document architecture decisions with rationale
    - Model receipt/collection concepts as catalog + lines, not fixed columns
      (per domain/cobranza-definiciones-confirmadas — buys the right to start
      before all data questions are answered)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Respect the review budget declared in `review_budget_lines` below (ask-on-risk
      delivery strategy); recommend chained PRs when a work unit is forecast to exceed it
  apply:
    guidelines:
      - Follow existing code patterns once a first module exists
      - Do not create a .sln/.csproj outside of an accepted change that explicitly scopes it
    tdd: false
    test_command: "dotnet test Inmobiliaria.Core.slnf --configuration Release"
  verify:
    test_command: "dotnet test Inmobiliaria.Core.slnf --configuration Release"
    build_command: "dotnet build Inmobiliaria.sln --configuration Release"
    coverage_threshold: 0
    rules:
      - Verify is MANDATORY for every change. It is never skipped because the tests pass or the
        work "looks done" — the contract-and-parties verification found two real defects that a
        green build had hidden.
      - A requirement with no enforcing test is a FINDING, even when the code is correct. Say
        plainly which requirements are untested rather than reporting them as covered.
      - Check every claim a design document makes about an invariant against the actual
        constructor and mutator code. design.md claimed the domain forbade a contract with zero
        units; it did not, and only reading the constructor caught it.
      - Docker must be running so the Testcontainers integration tests execute. A skipped test is
        a finding, never a pass.
  archive:
    - Warn before merging destructive deltas
    - Cross-check merged specs against linked domain Engram observations for contradictions
    - NEVER archive a change whose verify report still has unresolved CRITICAL findings. Close
      them, re-verify, and only then archive.
    - Amend the delta specs to record any rule that was implemented but never specified, so the
      archived specification never knows less than the code does.

review_budget_lines: 800
delivery_strategy: ask-on-risk
